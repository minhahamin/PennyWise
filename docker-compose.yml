version: "3.9"
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/pennywise.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - pennywise-data:/data
    depends_on: []
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  pennywise-data:
